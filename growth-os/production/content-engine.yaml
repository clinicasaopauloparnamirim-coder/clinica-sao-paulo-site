  - "Claims clínicos precisam de base apropriada."
  - "Nunca fabricar prova social."
  - "Não publicar volume por volume."

derivatives:
  canonical_page:
    outputs: [faq, carousel, stories, reel_script, whatsapp_script, reception_script]
  faq:
    outputs: [stories, carousel, reception_script]