name: Set MCP Auth Token

on:
  workflow_dispatch:
    inputs:
      token:
        description: "MCP_AUTH_TOKEN value (leave empty to auto-generate)"
        required: false
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane/playwright-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Put MCP_AUTH_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_TOKEN: ${{ inputs.token }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TOKEN}" ]; then
            TOKEN="${INPUT_TOKEN}"
          else
            TOKEN="$(openssl rand -base64 32 | tr -d '=+/\n' | head -c 40)"
          fi
          echo "Setting MCP_AUTH_TOKEN on Worker (value length=${#TOKEN})..."
          printf '%s' "$TOKEN" | npx wrangler secret put MCP_AUTH_TOKEN --config wrangler.toml
          echo "Done. Token starts with: ${TOKEN:0:6}..."
          # store a hash-only note in the job summary (not the full token)
          echo "### MCP_AUTH_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          echo "Secret set on Worker. Prefix: \`${TOKEN:0:6}...\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Full token is only in this job log (masked). Save it from the step output if you passed a custom value." >> "$GITHUB_STEP_SUMMARY"
