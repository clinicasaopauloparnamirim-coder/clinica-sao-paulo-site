name: GA4 Zaraz lead attribution correction

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the validated Zaraz change (false = read-only dry run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zaraz-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit and optionally correct the WhatsApp lead event mapping
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPLY_CHANGE: ${{ inputs.apply }}
          ZONE_ID: "447b130f411b1104a20a3c5ec4297164"
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const zoneId = process.env.ZONE_ID;
          const apply = process.env.APPLY_CHANGE === "true";
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is missing; no change applied.");
          const endpoint = `https://api.cloudflare.com/client/v4/zones/${zoneId}/settings/zaraz/config`;
          async function request(method, body) {
            const response = await fetch(endpoint, {
              method,
              headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
              ...(body === undefined ? {} : { body: JSON.stringify(body) })
            });
            let payload = {};
            try { payload = await response.json(); } catch {}
            if (!response.ok || payload.success !== true) {
              const apiErrors = Array.isArray(payload.errors) ? payload.errors.map(e => ({ code: e.code, message: e.message })) : [];
              throw new Error(`Cloudflare Zaraz ${method} failed (HTTP ${response.status}); API errors: ${JSON.stringify(apiErrors)}`);
            }
            return payload.result;
          }
          const config = await request("GET");
          const tools = config.tools || {};
          const ga4 = Object.values(tools).find(t => t?.component === "google-analytics_v4" && t?.name === "Google Analytics 4");
          const ads = Object.values(tools).find(t => t?.component === "google-ads" && t?.name === "Google Ads");
          if (!ga4 || !ga4.enabled || !ads || !ads.enabled) throw new Error("Expected enabled GA4 and Google Ads tools were not found; no change applied.");
          const candidates = Object.entries(ga4.actions || {}).filter(([, action]) =>
            action?.actionType === "event" &&
            action?.data?.en === "generate_lead" &&
            action?.data?.__zaraz_setting_name === "Lead WhatsApp" &&
            Array.isArray(action?.firingTriggers) && action.firingTriggers.includes("MxOq")
          );
          const adsActionIds = Object.keys(ads.actions || {}).filter(id => {
            const action = ads.actions[id];
            return action?.actionType === "conversion" &&
              action?.data?.__zaraz_setting_name === "Google Ads - Lead" &&
              action?.firingTriggers?.includes("MxOq");
          });
          if (adsActionIds.length !== 1) throw new Error("Expected exactly one Google Ads lead action; no change applied.");
          if (!config.triggers?.MxOq?.loadRules?.some(rule => rule?.action === "clickListener" && rule?.settings?.selector === ".whatsapp-track")) {
            throw new Error("The WhatsApp click trigger did not match the expected selector; no change applied.");
          }
          if (candidates.length === 0) {
            if (Object.values(ga4.actions || {}).some(a => a?.data?.en === "generate_lead")) {
              throw new Error("An unexpected generate_lead action exists; no automatic change applied.");
            }
            console.log("PASS no matching Zaraz Lead WhatsApp generate_lead action exists; no change required.");
            process.exit(0);
          }
          if (candidates.length !== 1) throw new Error(`Expected exactly one false-lead action, found ${candidates.length}; no change applied.`);
          const [actionId] = candidates[0];
          console.log(JSON.stringify({
            audit: "PASS",
            measurementId: ga4.settings?.tid || null,
            finding: "A WhatsApp CTA click was mapped to GA4 generate_lead",
            affectedActionId: actionId,
            trigger: "MxOq",
            clickTrackingPreserved: Boolean(ga4.actions?.AllTracks),
            googleAdsConversionPreserved: true,
            mode: apply ? "apply" : "dry-run"
          }));
          if (!apply) {
            console.log("DRY RUN PASS — no configuration was changed.");
            process.exit(0);
          }
          delete ga4.actions[actionId];
          await request("PUT", config);
          const after = await request("GET");
          const afterTools = after.tools || {};
          const afterGa4 = Object.values(afterTools).find(t => t?.component === "google-analytics_v4" && t?.name === "Google Analytics 4");
          const afterAds = Object.values(afterTools).find(t => t?.component === "google-ads" && t?.name === "Google Ads");
          const falseLeadRemains = Object.values(afterGa4?.actions || {}).some(a =>
            a?.actionType === "event" && a?.data?.en === "generate_lead" &&
            a?.data?.__zaraz_setting_name === "Lead WhatsApp" && a?.firingTriggers?.includes("MxOq")
          );
          const adsStillPresent = Object.values(afterAds?.actions || {}).some(a =>
            a?.actionType === "conversion" && a?.data?.__zaraz_setting_name === "Google Ads - Lead" &&
            a?.firingTriggers?.includes("MxOq")
          );
          if (falseLeadRemains || !adsStillPresent || !afterGa4?.actions?.AllTracks) {
            throw new Error("Post-write verification failed: GA4 event mapping or the separate Google Ads conversion was not preserved.");
          }
          console.log("PASS Zaraz updated: false GA4 generate_lead mapping removed; WhatsApp click tracking and Google Ads conversion preserved.");
          NODE
