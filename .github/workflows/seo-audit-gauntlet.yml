name: SEO Gauntlet (read-only)

on:
  pull_request:
    paths:
      - "tools/seo-gauntlet/**"
      - ".github/workflows/seo-audit-gauntlet.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "URL pública para auditar (somente leitura)"
        required: true
        default: "https://clinicasaopauloparnamirim.com.br/"
        type: string
      crawl:
        description: "Rastrear links internos (limite máximo 30 páginas)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tools/seo-gauntlet -p "test_*.py" -v

  public-audit:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AUDIT_URL: ${{ inputs.url || 'https://clinicasaopauloparnamirim.com.br/' }}
      AUDIT_CRAWL: ${{ inputs.crawl || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run public read-only audit
        shell: bash
        run: |
          args=()
          if [[ "$AUDIT_CRAWL" == "true" ]]; then args+=(--crawl); fi
          python tools/seo-gauntlet/seo_audit.py "$AUDIT_URL" "${args[@]}" --json seo-audit-report.json --markdown seo-audit-report.md
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: seo-gauntlet-report
          path: |
            seo-audit-report.json
            seo-audit-report.md
          if-no-files-found: error
