name: WhatsApp secret readiness (values never printed)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/whatsapp-secret-readiness.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report only whether required secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WA_APP_ID: ${{ secrets.WHATSAPP_APP_ID }}
          WA_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WA_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          report() {
            if [[ -n "$2" ]]; then
              echo "- $1: present"
            else
              echo "- $1: missing"
            fi
          }
          {
            echo "## WhatsApp integration credential readiness"
            echo
            report "CLOUDFLARE_API_TOKEN" "${CF_TOKEN}"
            report "CLOUDFLARE_ACCOUNT_ID" "${CF_ACCOUNT}"
            report "WHATSAPP_APP_ID" "${WA_APP_ID}"
            report "WHATSAPP_APP_SECRET" "${WA_APP_SECRET}"
            report "WHATSAPP_ACCESS_TOKEN" "${WA_ACCESS_TOKEN}"
            echo
            echo "Only presence/absence is reported; no secret values are printed or transmitted."
          } >> "$GITHUB_STEP_SUMMARY"
          report "CLOUDFLARE_API_TOKEN" "${CF_TOKEN}"
          report "CLOUDFLARE_ACCOUNT_ID" "${CF_ACCOUNT}"
          report "WHATSAPP_APP_ID" "${WA_APP_ID}"
          report "WHATSAPP_APP_SECRET" "${WA_APP_SECRET}"
          report "WHATSAPP_ACCESS_TOKEN" "${WA_ACCESS_TOKEN}"
