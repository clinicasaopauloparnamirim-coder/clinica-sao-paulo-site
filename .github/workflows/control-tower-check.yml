name: Control Tower feature checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "control-plane/playwright-mcp/**"
      - "public/control-tower/**"
      - ".github/workflows/control-tower-check.yml"
      - ".github/workflows/control-plane-deploy-v2.yml"
  push:
    branches: ["feature/9-brains-20-agents-control-tower-crm"]
    paths:
      - "control-plane/playwright-mcp/**"
      - "public/control-tower/**"
      - ".github/workflows/control-tower-check.yml"
      - ".github/workflows/control-plane-deploy-v2.yml"

permissions:
  contents: read

jobs:
  typecheck-and-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --prefix control-plane/playwright-mcp
          npm install
      - name: Typecheck Worker
        working-directory: control-plane/playwright-mcp
        run: npm run build
      - name: Verify brains, agents, CRM and dashboard contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry = fs.readFileSync('control-plane/playwright-mcp/src/agent-registry.ts', 'utf8');
          const specialistBlock = registry.match(/export const SPECIALISTS: SpecialistDefinition\[\] = \[([\s\S]*?)\n\];\n\nexport const BRAINS:/)?.[1] || '';
          const brainBlock = registry.match(/export const BRAINS: BrainDefinition\[\] = \[([\s\S]*?)\n\];\n\nexport const CAPABILITIES:/)?.[1] || '';
          const agentCount = (specialistBlock.match(/\{ id: "/g) || []).length;
          const brainCount = (brainBlock.match(/\{ id: "/g) || []).length;
          if (agentCount !== 20) throw new Error(`Expected 20 independent agents, got ${agentCount}`);
          if (brainCount !== 9) throw new Error(`Expected 9 brains, got ${brainCount}`);
          for (const route of [
            'pathname === "/control/crm/contacts"',
            'pathname.startsWith("/control/crm/contacts/")',
            'route === "/crm/contacts"',
            'upsertAttributedContact(message'
          ]) if (!fs.readFileSync('control-plane/playwright-mcp/src/index.ts','utf8').includes(route)) throw new Error(`Missing CRM contract: ${route}`);
          const dashboard = fs.readFileSync('public/control-tower/index.html','utf8');
          for (const feature of ['9 cérebros','20 agentes separados','CRM · pipeline de leads','/google/ads/audit','/google/ga4/audit','/google/gsc/audit','/control/crm/contacts']) {
            if (!dashboard.includes(feature)) throw new Error(`Dashboard missing expected feature: ${feature}`);
          }
          const pairing = fs.readFileSync('control-plane/playwright-mcp/src/agent-pairing.ts','utf8');
          if (!pairing.includes('model_roles:') || pairing.includes('brain_roles:') || pairing.includes('three-brain policy')) throw new Error('Model-provider metadata must remain distinct from the nine operational brains.');
          const workerSource = fs.readFileSync('control-plane/playwright-mcp/src/index.ts','utf8');
          const publicHealthStart = workerSource.indexOf('if (pathname === "/health") {');
          const privateHealthStart = workerSource.indexOf('if (pathname === "/control/health") {', publicHealthStart);
          const privateLoginStart = workerSource.indexOf('if (pathname === "/control/login"', privateHealthStart);
          if (publicHealthStart < 0 || privateHealthStart < 0 || privateLoginStart < 0) throw new Error('Health endpoint routes are missing or out of order.');
          const publicHealth = workerSource.slice(publicHealthStart, privateHealthStart);
          const privateHealth = workerSource.slice(privateHealthStart, privateLoginStart);
          if (!publicHealth.includes('Response.json({ ok: true }') || /brain_count|agent_count|capability_count|pairings|openai_api_configured|whatsapp_send_configured/.test(publicHealth)) {
            throw new Error('Public /health must expose only service availability, not internal diagnostics.');
          }
          if (!privateHealth.includes('if (!authorized(request, env)) return unauthorized();')) throw new Error('Detailed /control/health diagnostics are not behind authorization.');
          const deployWorkflow = fs.readFileSync('.github/workflows/control-plane-deploy-v2.yml','utf8');
          if (!deployWorkflow.includes('keys.length !== 1') || !deployWorkflow.includes('keys[0] !== "ok"')) throw new Error('Deployment smoke test does not enforce the minimal public health schema.');
          if (!deployWorkflow.includes('for path in /control/health /mcp/tower')) throw new Error('Unauthenticated diagnostic route is missing from the protected-route smoke loop.');
          if (!deployWorkflow.includes('/control/crm/contacts; do')) throw new Error('Anonymous CRM endpoint is missing from the protected-route smoke loop.');
          const cleanupIndex = deployWorkflow.indexOf('Sanitize unsafe NVIDIA bindings before deployment');
          const deployIndex = deployWorkflow.indexOf('Deploy Worker + public assets');
          const smokeIndex = deployWorkflow.indexOf('Smoke test');
          if (!(cleanupIndex >= 0 && cleanupIndex < deployIndex && deployIndex < smokeIndex)) throw new Error('Unsafe binding cleanup must happen before the final source deploy and smoke test.');
          console.log(JSON.stringify({ok:true,brainCount,agentCount,publicHealth:'minimal',protectedDiagnostics:'auth-required',crmEndpoints:3,dashboard:'present',deploySmoke:'aligned'},null,2));
          NODE
