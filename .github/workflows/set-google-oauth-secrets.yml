name: Set Google OAuth Secrets

on:
  workflow_dispatch:
    inputs:
      client_id_b64:
        description: "GOOGLE_CLIENT_ID (base64)"
        required: true
        type: string
      client_secret_b64:
        description: "GOOGLE_CLIENT_SECRET (base64)"
        required: true
        type: string

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane/playwright-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Put GOOGLE_CLIENT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL_B64: ${{ inputs.client_id_b64 }}
        run: |
          set -euo pipefail
          VAL="$(printf '%s' "$VAL_B64" | base64 -d)"
          printf '%s' "$VAL" | npx wrangler secret put GOOGLE_CLIENT_ID --config wrangler.toml
          echo "GOOGLE_CLIENT_ID set (len=${#VAL})"
      - name: Put GOOGLE_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL_B64: ${{ inputs.client_secret_b64 }}
        run: |
          set -euo pipefail
          VAL="$(printf '%s' "$VAL_B64" | base64 -d)"
          printf '%s' "$VAL" | npx wrangler secret put GOOGLE_CLIENT_SECRET --config wrangler.toml
          echo "GOOGLE_CLIENT_SECRET set (len=${#VAL})"
      - name: Health check
        run: |
          sleep 3
          curl -sS --retry 3 --retry-delay 2 "https://clinica-sao-paulo-site.clinicasaopauloparnamirim.workers.dev/health"
