name: Purge Cloudflare cache
on:
  workflow_dispatch:
  push:
    paths:
      - "public/**"
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge everything for zone
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN missing — skip purge"
            exit 0
          fi
          ZONE_ID="$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?account.id=$CF_ACCOUNT_ID&name=clinicasaopauloparnamirim.com.br" \
            | jq -r '.result[0].id')"
          echo "ZONE_ID=$ZONE_ID"
          test -n "$ZONE_ID" -a "$ZONE_ID" != "null"
          curl -fsS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            --data '{"purge_everything":true}' | jq .
