name: Control Plane Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "control-plane/playwright-mcp/**"
      - ".github/workflows/control-plane-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: control-plane/playwright-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Cloudflare Worker types
        run: npx wrangler types

      - name: Typecheck
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml

      - name: Smoke test deployed Worker
        run: |
          set -euo pipefail
          url="https://clinica-sao-paulo-site.clinicasaopauloparnamirim.workers.dev/health"
          body="$(curl -sS --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$url")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'

