name: Control Plane Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "control-plane/playwright-mcp/**"
      - ".github/workflows/control-plane-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: control-plane/playwright-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/playwright-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare Worker types
        run: npx wrangler types

      - name: Typecheck
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: control-plane/playwright-mcp
          command: deploy

