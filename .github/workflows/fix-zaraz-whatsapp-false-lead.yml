name: Fix Zaraz False WhatsApp Lead

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-zaraz-false-lead:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Snapshot and build guarded candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: "447b130f411b1104a20a3c5ec4297164"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token secret missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/zaraz-fix"
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/zaraz/config"
          code="$(curl -sS -o "$RUNNER_TEMP/zaraz-fix/get-before.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          test "$code" = "200" || { echo "GET Zaraz config failed: HTTP $code"; jq -c '{success,errors}' "$RUNNER_TEMP/zaraz-fix/get-before.json" 2>/dev/null || true; exit 1; }
          jq -e '.success == true and (.result | type == "object")' "$RUNNER_TEMP/zaraz-fix/get-before.json" >/dev/null
          jq '.result' "$RUNNER_TEMP/zaraz-fix/get-before.json" > "$RUNNER_TEMP/zaraz-fix/backup-v64.json"
          jq -e '
            .zarazVersion == 64 and
            (.variables | length == 0) and
            (.tools.tAMq.actions.INQv.data.en == "generate_lead") and
            (.tools.tAMq.actions.INQv.data.conversion == true) and
            (.tools.tAMq.actions.INQv.firingTriggers | index("MxOq") != null) and
            (.triggers.MxOq != null) and
            (.tools.tAMq.actions.AllTracks != null) and
            (.tools.yuqQ.actions.aAki != null)
          ' "$RUNNER_TEMP/zaraz-fix/backup-v64.json" >/dev/null || { echo "Safety guard failed; no change made."; exit 1; }
          jq 'del(.tools.tAMq.actions.INQv)' "$RUNNER_TEMP/zaraz-fix/backup-v64.json" > "$RUNNER_TEMP/zaraz-fix/candidate.json"
          echo "Safety guards passed: version 64, no secret variables, only target action INQv, WhatsApp trigger MxOq and Google Ads action aAki present."
      - name: Preserve pre-change and candidate configs
        uses: actions/upload-artifact@v4
        with:
          name: zaraz-config-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zaraz-fix/backup-v64.json
            ${{ runner.temp }}/zaraz-fix/candidate.json
          retention-days: 7
      - name: Update Zaraz preview config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: "447b130f411b1104a20a3c5ec4297164"
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/zaraz/config"
          code="$(curl -sS -o "$RUNNER_TEMP/zaraz-fix/put-result.json" -w '%{http_code}' -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/zaraz-fix/candidate.json" "$api")"
          if [[ "$code" != "200" ]]; then
            echo "Zaraz write denied or failed: HTTP $code"
            jq -c '{success,errors}' "$RUNNER_TEMP/zaraz-fix/put-result.json" 2>/dev/null || true
            exit 1
          fi
          jq -e '.success == true' "$RUNNER_TEMP/zaraz-fix/put-result.json" >/dev/null || { jq -c '{success,errors}' "$RUNNER_TEMP/zaraz-fix/put-result.json"; exit 1; }
          code="$(curl -sS -o "$RUNNER_TEMP/zaraz-fix/preview-check.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          test "$code" = "200" || { echo "Could not verify preview config: HTTP $code"; exit 1; }
          jq -e '
            .success == true and
            (.result.tools.tAMq.actions.INQv == null) and
            (.result.tools.tAMq.actions.AllTracks != null) and
            (.result.triggers.MxOq != null) and
            (.result.tools.yuqQ.actions.aAki != null)
          ' "$RUNNER_TEMP/zaraz-fix/preview-check.json" >/dev/null || { echo "Preview readback failed; not publishing."; exit 1; }
          echo "Preview readback verified; only INQv is removed. Publishing next."
      - name: Publish corrected Zaraz config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: "447b130f411b1104a20a3c5ec4297164"
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/zaraz/publish"
          description='Removed false GA4 generate_lead action INQv; preserved WhatsApp trigger and Google Ads conversion.'
          code="$(curl -sS -o "$RUNNER_TEMP/zaraz-fix/publish-result.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$(jq -n --arg d "$description" '$d')" "$api")"
          if [[ "$code" != "200" ]]; then
            echo "Zaraz publish failed: HTTP $code"
            jq -c '{success,errors}' "$RUNNER_TEMP/zaraz-fix/publish-result.json" 2>/dev/null || true
            exit 1
          fi
          jq -e '.success == true' "$RUNNER_TEMP/zaraz-fix/publish-result.json" >/dev/null || { jq -c '{success,errors}' "$RUNNER_TEMP/zaraz-fix/publish-result.json"; exit 1; }
          code="$(curl -sS -o "$RUNNER_TEMP/zaraz-fix/final-check.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/zaraz/config")"
          test "$code" = "200" || { echo "Final Zaraz readback failed: HTTP $code"; exit 1; }
          jq -e '
            .success == true and
            (.result.tools.tAMq.actions.INQv == null) and
            (.result.tools.tAMq.actions.AllTracks != null) and
            (.result.triggers.MxOq != null) and
            (.result.tools.yuqQ.actions.aAki != null)
          ' "$RUNNER_TEMP/zaraz-fix/final-check.json" >/dev/null || { echo "Final config verification failed."; exit 1; }
          echo "PASS: false generate_lead action removed; WhatsApp trigger, GA4 AllTracks and Google Ads conversion preserved."
