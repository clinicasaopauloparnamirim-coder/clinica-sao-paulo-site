name: Control Plane Deploy V2

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "control-plane/playwright-mcp/**"
      - ".github/workflows/control-plane-deploy-v2.yml"
      - "wrangler.jsonc"
      - "package.json"
      - "public/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Install deps at root (Workers Builds + GHA) and in worker package
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --prefix control-plane/playwright-mcp
          npm install
      - name: Typecheck worker
        working-directory: control-plane/playwright-mcp
        run: npm run build
      - name: Sanitize unsafe NVIDIA bindings before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: clinica-sao-paulo-site
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account, WORKER_NAME: name } = process.env;
          if (!token || !account || !name) throw new Error("Cloudflare deployment credentials are missing.");
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/settings`;
          const headers = { Authorization: `Bearer ${token}` };
          const currentResponse = await fetch(endpoint, { headers });
          const current = await currentResponse.json();
          if (!currentResponse.ok || current.success !== true || !Array.isArray(current.result?.bindings)) {
            throw new Error(`Could not safely inspect Worker bindings (HTTP ${currentResponse.status}).`);
          }
          const bindings = current.result.bindings;
          const rotationConfirmed = bindings.some((binding) =>
            binding?.name === "NVIDIA_KEY_ROTATED" &&
            binding?.type === "plain_text" &&
            binding?.text === "true"
          );

          // Settings API controls non-secret bindings only. The legacy name N and any
          // NVIDIA-looking plain-text values are removed here; secret_text bindings
          // must be managed through the dedicated /secrets API below.
          const unsafeSetting = (binding) =>
            binding?.name === "N" ||
            (binding?.type === "plain_text" && typeof binding?.text === "string" && /^nvapi-/i.test(binding.text));
          const filtered = bindings.filter((binding) => !unsafeSetting(binding));
          if (filtered.length !== bindings.length) {
            const form = new FormData();
            form.append("settings", new Blob([JSON.stringify({ bindings: filtered })], { type: "application/json" }));
            const patchResponse = await fetch(endpoint, { method: "PATCH", headers, body: form });
            const patchData = await patchResponse.json();
            if (!patchResponse.ok || patchData.success !== true) {
              throw new Error(`Failed to remove unsafe NVIDIA plaintext binding (HTTP ${patchResponse.status}).`);
            }
          }

          const verifySettingsResponse = await fetch(endpoint, { headers });
          const verifySettings = await verifySettingsResponse.json();
          if (!verifySettingsResponse.ok || verifySettings.success !== true || !Array.isArray(verifySettings.result?.bindings)) {
            throw new Error("Could not verify Worker settings after NVIDIA binding cleanup.");
          }
          if (verifySettings.result.bindings.some(unsafeSetting)) {
            throw new Error("Unsafe NVIDIA plaintext binding still exists after cleanup.");
          }

          // Secret-text bindings require the dedicated Secrets endpoint. Remove the
          // old credential unless a fresh key was explicitly installed and marked.
          const secretsEndpoint = endpoint.replace(/\/settings$/, "/secrets");
          const secretsResponse = await fetch(secretsEndpoint, { headers });
          const secrets = await secretsResponse.json();
          if (!secretsResponse.ok || secrets.success !== true || !Array.isArray(secrets.result)) {
            throw new Error(`Could not safely inspect Worker secrets (HTTP ${secretsResponse.status}).`);
          }

          if (!rotationConfirmed && secrets.result.some((secret) => secret?.name === "NVIDIA_API_KEY")) {
            const deleteResponse = await fetch(`${secretsEndpoint}/NVIDIA_API_KEY`, { method: "DELETE", headers });
            const deleteResult = await deleteResponse.json();
            if (!deleteResponse.ok || deleteResult.success !== true) {
              throw new Error(`Failed to remove old NVIDIA_API_KEY secret (HTTP ${deleteResponse.status}).`);
            }
          }

          const verifySecretsResponse = await fetch(secretsEndpoint, { headers });
          const verifySecrets = await verifySecretsResponse.json();
          if (!verifySecretsResponse.ok || verifySecrets.success !== true || !Array.isArray(verifySecrets.result)) {
            throw new Error("Could not verify Worker secrets after NVIDIA key cleanup.");
          }
          if (!rotationConfirmed && verifySecrets.result.some((secret) => secret?.name === "NVIDIA_API_KEY")) {
            throw new Error("Old NVIDIA_API_KEY secret still exists after cleanup.");
          }
          console.log(rotationConfirmed
            ? "Verified explicit NVIDIA rotation flag; retained the replacement secret and removed unsafe plaintext alias."
            : "Removed and verified removal of old NVIDIA credential binding(s).");
          NODE
      - name: Deploy Worker + public assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars
      - name: Smoke test
        run: |
          set -euo pipefail
          health_url="https://clinica-sao-paulo-site.clinicasaopauloparnamirim.workers.dev/health?deploy_check=$(date +%s)"
          body="$(curl -sS --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$health_url")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"brain_count":9'
          echo "$body" | grep -q '"agent_count":20'
          echo "$body" | grep -q '"capability_count":21'
          echo "$body" | grep -q '"autonomous_function_count":20'
          # Health must expose pairing and auth status without exposing credentials.
          echo "$body" | grep -q '"openai_api_configured":'
          echo "$body" | grep -q '"pairings":'
          # New dashboard and CRM must be present in the release artifact.
          test -f public/control-tower/index.html
          grep -q '20 agentes separados' public/control-tower/index.html
          grep -q '/control/crm/contacts' public/control-tower/index.html
      - name: Verify public HTML has no dual Zaraz
        run: |
          set -euo pipefail
          # workers.dev may not be custom domain; check asset from deploy artifact path
          if ! grep -q 'clique_whatsapp' public/index.html; then
            echo "missing clique_whatsapp tracker" && exit 1
          fi
          if grep -q 'zaraz is loaded twice' public/index.html; then
            echo "baked dual zaraz still in public/index.html" && exit 1
          fi
          echo "public/index.html P0 HTML checks OK"
      - name: Verify protected Control Tower routes
        run: |
          set -euo pipefail
          base="https://clinica-sao-paulo-site.clinicasaopauloparnamirim.workers.dev"
          for path in /mcp/tower /control/architecture /control/agents /google/ads/oauth/start /google/oauth/start /google/ads/audit /google/ga4/audit /google/gsc/audit /google/business-profile/audit /control/attribution/report; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$base$path")"
            echo "$path -> HTTP $code"
            test "$code" = "401"
          done
          orchestrate_code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 30 -X POST "$base/orchestrate" -H 'content-type: application/json' --data '{}')"
          echo "POST /orchestrate without credentials -> HTTP $orchestrate_code"
          test "$orchestrate_code" = "401"
          webhook_post_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$base/webhooks/whatsapp" -H 'content-type: application/json' --data '{}')"
          echo "/webhooks/whatsapp unsigned POST -> HTTP $webhook_post_code"
          test "$webhook_post_code" = "403" || test "$webhook_post_code" = "503"
          webhook_get_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base/webhooks/whatsapp?hub.mode=subscribe&hub.verify_token=invalid&hub.challenge=probe")"
          echo "/webhooks/whatsapp invalid verification -> HTTP $webhook_get_code"
          test "$webhook_get_code" = "403" || test "$webhook_get_code" = "503"

