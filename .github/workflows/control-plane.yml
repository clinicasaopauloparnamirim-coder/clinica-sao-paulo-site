name: Control Plane

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "control-plane/playwright-mcp/**"
      - ".github/workflows/control-plane.yml"
  pull_request:
    paths:
      - "control-plane/playwright-mcp/**"
      - ".github/workflows/control-plane.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane/playwright-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run build
