name: Control Plane PR Check

on:
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-pr-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: control-plane/playwright-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx wrangler types
      - run: npm run build
