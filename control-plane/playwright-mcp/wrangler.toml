name = "clinica-sao-paulo-site"
main = "src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[previews]
[previews.vars]
WHATSAPP_PHONE_NUMBER_ID = ""
GA4_MEASUREMENT_ID = ""
OPENEXECUTIVE_ENABLED = "false"
OPENEXECUTIVE_MCP_URL = "https://example.invalid/mcp"

[previews.ai]
binding = "AI"

[previews.browser]
binding = "BROWSER"

[[previews.durable_objects.bindings]]
name = "WHATSAPP_LEDGER"
class_name = "WhatsAppLedger"

[[previews.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "PlaywrightMCP"

[[previews.durable_objects.bindings]]
name = "CONTROL_AGENT"
class_name = "ControlAgent"

[[previews.durable_objects.bindings]]
name = "GOOGLE_OAUTH_STORE"
class_name = "GoogleOAuthStore"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlaywrightMCP"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ControlAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WhatsAppLedger"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["GoogleOAuthStore"]

[[durable_objects.bindings]]
name = "WHATSAPP_LEDGER"
class_name = "WhatsAppLedger"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "PlaywrightMCP"

[[durable_objects.bindings]]
name = "CONTROL_AGENT"
class_name = "ControlAgent"


[[durable_objects.bindings]]
name = "GOOGLE_OAUTH_STORE"
class_name = "GoogleOAuthStore"
