name = "clinica-sao-paulo-site"
main = "src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlaywrightMCP"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ControlAgent"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "PlaywrightMCP"

[[durable_objects.bindings]]
name = "CONTROL_AGENT"
class_name = "ControlAgent"
