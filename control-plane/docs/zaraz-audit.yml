name: Zaraz GA4 Audit
on:
  push:
    branches: ["main"]
    paths:
      - "control-plane/docs/zaraz-audit.yml"
      - "public/index.html"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Zaraz config
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ZONE_ID="$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?account.id=$CF_ACCOUNT_ID&name=clinicasaopauloparnamirim.com.br" | jq -r '.result[0].id')"
          test -n "$ZONE_ID" -a "$ZONE_ID" != "null"
          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/zaraz/config" > /tmp/zaraz.json
          jq '{success, result: (.result | {zarazVersion, dataLayer, settings, tools: (.tools | with_entries(.value |= {name,component,enabled,actions,neoEvents,settings})), triggers, variables: (.variables | keys)})}' /tmp/zaraz.json > control-plane/docs/zaraz-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-plane/docs/zaraz-audit.json
          git diff --cached --quiet || git commit -m "Audit Zaraz GA4 configuration"
          git push
