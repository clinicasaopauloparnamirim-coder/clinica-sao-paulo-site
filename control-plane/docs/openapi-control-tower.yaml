openapi: 3.1.0
info:
  title: Clínica São Paulo — Control Tower
  description: |
    API do Control Tower (Google Ads, GA4, Search Console).
    Autenticação: Bearer token (MCP_AUTH_TOKEN).
    Customer ID Ads: 4603647788
  version: "1.0.0"
servers:
  - url: https://clinica-sao-paulo-site.clinicasaopauloparnamirim.workers.dev
    description: Cloudflare Worker
  - url: https://control.clinicasaopauloparnamirim.com.br
    description: Domínio custom (se configurado no Cloudflare)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: Status do worker
      security: []
      responses:
        "200":
          description: OK
  /google/ads/auth-check:
    get:
      operationId: adsAuthCheck
      summary: Valida OAuth Google Ads
      responses:
        "200":
          description: Conta conectada
  /google/ads/audit:
    get:
      operationId: adsAudit
      summary: Auditoria Ads (campanhas, keywords, conversões 30d)
      responses:
        "200":
          description: JSON com campaigns, keywords, conversions
  /google/ads/search:
    post:
      operationId: adsSearch
      summary: GAQL search (somente leitura)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Query GAQL
                  example: SELECT campaign.id, campaign.name, campaign.status FROM campaign WHERE campaign.status != 'REMOVED'
      responses:
        "200":
          description: Resultados GAQL
  /google/ads/mutate:
    post:
      operationId: adsMutate
      summary: Mutate de resource (budget, campaign, adGroup, criteria, ads, userLists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, operations]
              properties:
                resource:
                  type: string
                  enum:
                    - campaignBudgets
                    - campaigns
                    - adGroups
                    - adGroupCriteria
                    - adGroupAds
                    - campaignCriteria
                    - userLists
                    - remarketingActions
                operations:
                  type: array
                  items:
                    type: object
                validateOnly:
                  type: boolean
                  default: true
                confirm:
                  type: boolean
                  description: Obrigatório true para mutação live
                  default: false
      responses:
        "200":
          description: Resultado do mutate
  /google/ads/batch-mutate:
    post:
      operationId: adsBatchMutate
      summary: Batch mutate (mutateOperations)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  items:
                    type: object
                validateOnly:
                  type: boolean
                  default: true
                confirm:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Resultado batch
  /google/ga4/audit:
    get:
      operationId: ga4Audit
      summary: Key events da property GA4 552216899
      responses:
        "200":
          description: Lista de key events
  /google/gsc/audit:
    get:
      operationId: gscAudit
      summary: Performance Search Console (~28 dias)
      responses:
        "200":
          description: topQueries, topPages, byDevice
  /marketing/social-snapshot:
    get:
      operationId: marketingSocialSnapshotRead
      summary: Read the last persisted, sanitized Instagram metrics snapshot
      responses:
        "200":
          description: Current snapshot or found=false
    post:
      operationId: marketingSocialSnapshotWrite
      summary: Persist read-only analytics for the official clinic Instagram account
      description: Only accepts @clinicasaopauloparnamirim. Does not publish posts, send messages, or change ads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [captured_at, profile, account_insights, media, audience_city, missing_metrics]
              properties:
                captured_at: { type: string, format: date-time }
                profile:
                  type: object
                  required: [id, username, account_type, followers_count, follows_count, media_count]
                  properties:
                    id: { type: string }
                    username: { type: string, enum: [clinicasaopauloparnamirim] }
                    account_type: { type: string, enum: [BUSINESS, CREATOR] }
                    followers_count: { type: number, minimum: 0 }
                    follows_count: { type: number, minimum: 0 }
                    media_count: { type: number, minimum: 0 }
                account_insights:
                  type: array
                  maxItems: 30
                  items: { type: object }
                media:
                  type: array
                  maxItems: 10
                  items: { type: object }
                audience_city:
                  type: array
                  maxItems: 50
                  items: { type: object }
                missing_metrics:
                  type: array
                  maxItems: 30
                  items: { type: string }
      responses:
        "200":
          description: Snapshot was validated and stored
        "400":
          description: Invalid payload
        "403":
          description: Account is outside the clinic's scope
        "413":
          description: Payload is too large

  /marketing/brief:
    post:
      operationId: marketingBrief
      summary: Generate a draft marketing brief using the latest Instagram snapshot
      description: Returns a draft for human review. Never publishes or mutates advertisements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [treatment]
              properties:
                treatment: { type: string, minLength: 1, maxLength: 160 }
                objective: { type: string, maxLength: 300 }
                audience: { type: string, maxLength: 300 }
                approvedOffer: { type: string, maxLength: 300 }
                channels:
                  type: array
                  maxItems: 5
                  items: { type: string, enum: [instagram_stories, instagram_reels, instagram_feed, google_search, whatsapp, landing_page] }
      responses:
        "200":
          description: Draft brief with snapshot availability and freshness
        "400":
          description: Invalid payload
        "502":
          description: No valid brief was generated

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: MCP_AUTH_TOKEN do Worker Cloudflare
